<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="images/sparkle.png">
</head>

<!-- Load in the header html file -->
<script>
    fetch('header.html').then(response => response.text()).then(data => {document.getElementById('header').innerHTML = data;});
</script>

<body>
    <div class="all">
        <!-- Header, common to all pages -->
         <div id="header"></div>

        <!-- Background Image for the Website -->
        <div class="background-wrapper"></div>

        <!-- Main Title -->
        <div class="main-content">
            <div class="fullname-container">
                <div class="fullname">
                    <h1>Disc Movies</h1>
                    <p>From the Supplementary Materials of my 2026 paper</p>
                </div>
            </div>
        </div>

        <!-- Main Container -->
        <div class="content-container">
            <div class="container">
                <div class="items-container">
                    <div class="left-hand-items">

                        <div class="video-item">
                            <h3>The First Disc of γ<sub>1</sub> Zoom 1</h3>
                            <video controls class="disc-video">
                                <source src="./movies/gamma1zoom1sink1crop.mp4" type="video/mp4">
                            </video>
                        </div>
                        <div class="video-item">
                            <h3>The First Disc of γ<sub>1</sub> Zoom 3</h3>
                            <video controls class="disc-video">
                                <source src="./movies/gamma1zoom3sink1crop.mp4" type="video/mp4">
                            </video>
                        </div>
                        <div class="video-item">
                            <h3>The First Disc of γ<sub>1000</sub> Zoom 1</h3>
                            <video controls class="disc-video">
                                <source src="./movies/gamma1000zoom1sink1crop.mp4" type="video/mp4">
                            </video>
                        </div>
                        <div class="video-item">
                            <h3>The First Disc of γ<sub>1000</sub> Zoom 3</h3>
                            <video controls class="disc-video">
                                <source src="./movies/gamma1000zoom3sink1crop.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                    
                    <div class="right-hand-items">
                        <div class="video-item">
                            <h3>The First Disc of γ<sub>1</sub> Zoom 2</h3>
                            <video controls class="disc-video">
                                <source src="./movies/gamma1zoom2sink1crop.mp4" type="video/mp4">
                            </video>
                        </div>
                        <div class="video-item">
                            <h3>The First Disc of γ<sub>1</sub> Zoom 4</h3>
                            <video controls class="disc-video">
                                <source src="./movies/gamma1zoom4sink1crop.mp4" type="video/mp4">
                            </video>
                        </div>
                        <div class="video-item">
                            <h3>The First Disc of γ<sub>1000</sub> Zoom 2</h3>
                            <video controls class="disc-video">
                                <source src="./movies/gamma1000zoom2sink1crop.mp4" type="video/mp4">
                            </video>
                        </div> 

                        <a class="inner-item" href="./index.html">
                            <div class="outer-item" id="return">
                                <h3>Return to Main Page</h3>
                            </div>                        
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
